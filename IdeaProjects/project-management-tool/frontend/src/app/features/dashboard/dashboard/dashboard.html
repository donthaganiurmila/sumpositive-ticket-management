
<div class="dashboard-container">

  <header class="dashboard-header">
    <div>
      <h1>Welcome, User!</h1>
      <p>Here's your project management overview.</p>
    </div>

    <button class="logout-button" (click)="logout()">
      Logout
    </button>
  </header>

  <section class="dashboard-content">

    <h2>Dashboard Overview</h2>

    <div class="statistics-grid">

      <div class="stat-card">
        <h3>Total Tasks</h3>
        <p>0</p>
      </div>

      <div class="stat-card">
        <h3>To Do</h3>
        <p>0</p>
      </div>

      <div class="stat-card">
        <h3>In Progress</h3>
        <p>0</p>
      </div>

      <div class="stat-card">
        <h3>Completed</h3>
        <p>0</p>
      </div>

    </div>

  </section>

</div>
